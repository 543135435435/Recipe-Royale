<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta -->
    <title>Recipe Royale — Discover the World, One Recipe at a Time</title>
    <meta name="description" content="Explore thousands of authentic recipes from cuisines around the world. Cook, share, and celebrate the art of food with a premium global culinary platform." />
    <meta name="keywords" content="recipes, cooking, food, cuisine, chefs, baking, global recipes, Pakistani food, Indian food, Italian food, Japanese food, Mexican food" />
    <meta name="author" content="Recipe Royale" />
    <meta name="theme-color" content="#C5973E" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recipe Royale — Premium Recipe Platform" />
    <meta property="og:description" content="Where every recipe tells a story. Discover, cook, share, and celebrate the world's finest culinary creations." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://reciperoyale.com" />
    <meta property="og:site_name" content="Recipe Royale" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recipe Royale — Premium Recipe Platform" />
    <meta name="twitter:description" content="Where every recipe tells a story. Discover, cook, share, and celebrate the world's finest culinary creations." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Recipe Royale",
      "description": "Premium global recipe platform for discovering, cooking, and sharing recipes from around the world.",
      "url": "https://reciperoyale.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://reciperoyale.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
